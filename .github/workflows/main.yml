name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheme:
        description: "scheme"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rootless
          - rootful
          - roothide

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: set matrix
        id: set-matrix
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "all" ]; then
            echo 'matrix=["rootless","rootful","roothide"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$SCHEME\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf master.zip sdks-master

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      # the rootful deb has an iOS 7 arm64 slice but an old-ABI arm64e slice that current ld rejects,
      # so the rootful link stub takes arm64e from the rootless deb with the rootful install name
      - name: install altlist
        env:
          ALTLIST_VERSION: 1.0.11
          ALTLIST_ROOTFUL_SHA256: c2299f0ee65bfb25c4549ec3f24594b035a7cdab364dbfffbf632d67e723b75f
          ALTLIST_ROOTLESS_SHA256: 5835a6b0eacd5d99d272b3f74a744b28b1c4c16ada03aade36d0a636bca5e1f0
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/altlist"
          mkdir -p "$work" && cd "$work"
          fetch() {
            local deb="com.opa334.altlist_${ALTLIST_VERSION}_$1.deb"
            curl -fsSLO "https://opa334.github.io/debs/$deb"
            echo "$2  $deb" | shasum -a 256 -c -
            mkdir -p "$1" && (cd "$1" && ar x "../$deb" && mkdir data && tar -xf data.tar.* -C data)
          }
          fetch iphoneos-arm "$ALTLIST_ROOTFUL_SHA256"
          fetch iphoneos-arm64 "$ALTLIST_ROOTLESS_SHA256"
          rootful=iphoneos-arm/data/Library/Frameworks/AltList.framework
          rootless=iphoneos-arm64/data/var/jb/Library/Frameworks/AltList.framework

          lipo "$rootful/AltList" -thin arm64 -output arm64.dylib
          lipo "$rootless/AltList" -thin arm64e -output arm64e.dylib
          install_name_tool -id /Library/Frameworks/AltList.framework/AltList arm64e.dylib
          mkdir -p "$THEOS/lib"
          rm -rf "$THEOS/lib/AltList.framework"
          cp -R "$rootful" "$THEOS/lib/"
          lipo -create arm64.dylib arm64e.dylib -output "$THEOS/lib/AltList.framework/AltList"

          mkdir -p "$THEOS/lib/iphone/rootless"
          rm -rf "$THEOS/lib/iphone/rootless/AltList.framework"
          cp -R "$rootless" "$THEOS/lib/iphone/rootless/"

      - name: build (${{ matrix.scheme }})
        run: |
          SCHEME_FLAG=""
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=rootless"
          elif [ "${{ matrix.scheme }}" = "roothide" ]; then
            SCHEME_FLAG="THEOS_PACKAGE_SCHEME=roothide"
          fi
          make clean
          make package \
            ARCHS="arm64 arm64e" \
            FINALPACKAGE=1 \
            $SCHEME_FLAG

      - name: upload package (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-package
          path: packages/*.deb

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-packages
          pattern: "*-package"
          merge-multiple: true

      - name: update nightly release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./all-packages/*.deb"
          allowUpdates: true
          tag: nightly
          name: "Nightly"
          body: |
            This build was automatically generated from the latest commit on `main`.
            
            **Commit SHA:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}
            
            > [!NOTE]
            > A nightly build is basically the next update partially done. Additionally, this build might have the old version number but the code itself should has the latest commit.
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
